name: CI

# Runs on a push to main: it checks the code, releases the version of Cargo.toml when its tag
# does not exist, and deploys the site. Start it from the Actions tab to run it again, or add the
# `ci` label to a PR to check it and every later push to it.
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [labeled, synchronize, reopened]

concurrency:
  group: ${{ github.event_name != 'pull_request' && 'release' || format('check-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Install imp
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://imp-ui.com/install.sh | INSTALL_DIR="$HOME/.local/bin" bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the console page
        working-directory: console
        run: imp build --pwa
      - run: cargo verify

  version:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      exists: ${{ steps.tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: read
        run: echo "version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
      - id: tag
        run: |
          if git rev-parse "v${{ steps.read.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.exists == 'false'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: imp-aly-linux-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: imp-aly-linux-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: imp-aly-macos-x64
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: imp-aly-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Install musl
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install imp
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://imp-ui.com/install.sh | INSTALL_DIR="$HOME/.local/bin" bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the console page
        working-directory: console
        run: imp build --pwa
      - name: Compile
        run: |
          cargo build --release --locked --package imp-aly --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/imp-aly ${{ matrix.asset }}
      - name: Smoke test
        run: |
          test "$(./${{ matrix.asset }} --version)" = "${{ needs.version.outputs.version }}"
          ./${{ matrix.asset }} server --foreground -p 4411 -d "$RUNNER_TEMP/data" -a "$RUNNER_TEMP/key" &
          sleep 3
          mkdir "$RUNNER_TEMP/build"
          printf '{"pages":["/","/invoices"],"zones":["smoke.list"],"outcomes":["smoke.sent"]}' > "$RUNNER_TEMP/build/app-analytics.json"
          ./${{ matrix.asset }} app add smoke "$RUNNER_TEMP/build" --origins https://smoke.example -a "$RUNNER_TEMP/key"
          at="$(date +%s)000"
          curl -fsS -X POST http://127.0.0.1:4411/collect/smoke -d "[
            {\"type\":\"error\",\"visit\":\"v1\",\"at\":$at,\"page\":\"/invoices\"},
            {\"type\":\"seen\",\"visit\":\"v1\",\"at\":$at,\"page\":\"/invoices\",\"zone\":\"smoke.list\"},
            {\"type\":\"outcome\",\"visit\":\"v1\",\"at\":$at,\"page\":\"/invoices\",\"name\":\"smoke.sent\"},
            {\"type\":\"outcome\",\"visit\":\"v1\",\"at\":$at,\"page\":\"/invoices\",\"name\":\"smoke.forged\"}
          ]" | grep '"rejected":1'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:4411/collect/smoke -H 'origin: https://other.example' -d '[]')" = 403
          sleep 4
          ./${{ matrix.asset }} query '{"app":"smoke"}' --json -a "$RUNNER_TEMP/key" | grep '"matched": 3'
          curl -fsS -i -X OPTIONS http://127.0.0.1:4410/query \
            -H 'origin: https://aly.imp-ui.com' \
            -H 'access-control-request-method: POST' | grep -i 'access-control-allow-origin: \*'
          ./${{ matrix.asset }} console --port 4400 &
          sleep 2
          curl -fsS http://127.0.0.1:4400/ | grep 'id="app"'
          curl -fsS http://127.0.0.1:4400/manifest.webmanifest | grep '"name": "imp-aly console"'
          kill %2
          kill %1
      - name: Checksum
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          else
            shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Verify checksums
        working-directory: assets
        run: sha256sum -c *.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          files: assets/*

  pages:
    needs: [check, release]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.check.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install imp
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://imp-ui.com/install.sh | INSTALL_DIR="$HOME/.local/bin" bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build site
        env:
          IMP_ALY_SITE_SERVER: "" # https://aly.admware.com once the server is set up
        run: cargo xtask build-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - uses: actions/deploy-pages@v4
