name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno task test
      - name: Install imp
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://sobanieca.github.io/imp-ui/install.sh | INSTALL_DIR="$HOME/.local/bin" bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check the console page
        working-directory: console
        run: |
          imp fmt --check
          imp lint
          imp test --unit
          imp build

  version:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      exists: ${{ steps.tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - id: read
        run: echo "version=$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('deno.json')).version)")" >> "$GITHUB_OUTPUT"
      - id: tag
        run: |
          if git rev-parse "v${{ steps.read.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.exists == 'false'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: imp-aly-linux-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: imp-aly-linux-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: imp-aly-macos-x64
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: imp-aly-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install imp
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://sobanieca.github.io/imp-ui/install.sh | INSTALL_DIR="$HOME/.local/bin" bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the console page
        working-directory: console
        run: imp build
      - name: Compile
        run: >
          deno compile -A --target ${{ matrix.target }}
          --include src/storage-worker.js --include src/query-worker.js --include console/dist
          -o ${{ matrix.asset }} main.js
      - name: Smoke test
        run: |
          test "$(./${{ matrix.asset }} --version)" = "${{ needs.version.outputs.version }}"
          ./${{ matrix.asset }} server --foreground -p 2980 -d "$RUNNER_TEMP/data" -a "$RUNNER_TEMP/key" &
          sleep 3
          printf '/\n/invoices\n' > "$RUNNER_TEMP/app-map.txt"
          ./${{ matrix.asset }} app add smoke "$RUNNER_TEMP/app-map.txt" -a "$RUNNER_TEMP/key"
          curl -fsS -X POST http://127.0.0.1:2980/collect/smoke \
            -d "{\"type\":\"error\",\"visit\":\"v1\",\"at\":$(date +%s)000,\"page\":\"/invoices\"}"
          sleep 4
          ./${{ matrix.asset }} query '{"app":"smoke"}' --json -a "$RUNNER_TEMP/key" | grep '"matched": 1'
          export XDG_CONFIG_HOME="$RUNNER_TEMP/config"
          ./${{ matrix.asset }} add local http://127.0.0.1:2981 -a "$RUNNER_TEMP/key"
          ./${{ matrix.asset }} console --port 8010 &
          sleep 2
          curl -fsS http://127.0.0.1:8010/ | grep 'id="app"'
          curl -fsS http://127.0.0.1:8010/api/apps | grep '"name":"smoke"'
          kill %2
          kill %1
      - name: Checksum
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          else
            shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Verify checksums
        working-directory: assets
        run: sha256sum -c *.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          files: assets/*

  pages:
    needs: [check, release]
    if: always() && github.event_name == 'push' && needs.check.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp install.sh _site/
          deno run -A dev/versions-manifest.js > _site/versions.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
